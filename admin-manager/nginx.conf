# =========================
# 全局设置
# =========================
user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
}

# =========================
# HTTP 配置块
# =========================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 10m;
    server_tokens off;

    # -----------------------------------
    # 1. HTTP -> HTTPS 重定向 (80端口)
    # -----------------------------------
    server {
        listen 80;
        server_name _;  # 接受任意 IP
        return 301 https://$host$request_uri;
    }

    # -----------------------------------
    # 2. 后端负载均衡定义 (原有 8080 端口)
    # -----------------------------------
    upstream backend {
        # 轮询算法（默认）
        server 172.23.211.229:8080 max_fails=2 fail_timeout=30s;
        server 172.23.211.230:8080 max_fails=2 fail_timeout=30s;
    }

    # -----------------------------------
    # 3. 新增: 后端负载均衡定义 (8088端口)
    # -----------------------------------
    upstream backend_8088 {
        # 轮询算法（默认）
        server 172.23.211.229:8088 max_fails=2 fail_timeout=30s;
        server 172.23.211.230:8088 max_fails=2 fail_timeout=30s;
    }

    # -----------------------------------
    # 4. HTTPS 主站点配置 (8443端口)
    # -----------------------------------
    server {
        listen 8443 ssl http2;
        server_name _;  # 接受任意 IP

        # ---- SSL 证书路径（请确保 /etc/nginx/ssl 目录中有证书文件） ----
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ---- 安全加密设置 ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ---- HTTP 安全头部 (可选) ----
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # -----------------------------------
        # 5. 核心代理转发配置 (转发到 8080端口)
        # -----------------------------------
        location / {
            proxy_pass http://backend;

            # 关键：告知后端当前使用的是 HTTPS，防止 SpringBoot 重定向循环
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 传递真实客户端 IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 超时与缓冲区设置
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # -----------------------------------
    # 6. 新增: HTTPS 443 端口负载均衡服务
    # -----------------------------------
    server {
        listen 443 ssl http2;
        server_name _;  # 接受任意 IP

        # ---- SSL 证书路径（请确保 /etc/nginx/ssl 目录中有证书文件） ----
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ---- 安全加密设置 ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 直接转发到 backend_8088 upstream
        location / {
            proxy_pass http://backend_8088;

            # 传递真实客户端 IP（保持一致性）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 关键：告知后端当前使用的是 HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # 基础超时设置
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect off;
        }
    }
}