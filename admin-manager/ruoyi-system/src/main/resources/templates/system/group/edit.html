<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Edit Group')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-group-edit" th:object="${cspResourceGroup}">
            <input name="groupid" th:field="*{groupid}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Request Method：</label>
                <div class="col-sm-8">
                    <input name="reqmethod" th:field="*{reqmethod}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Content Type：</label>
                <div class="col-sm-8">
                    <select name="contenttype" class="form-control m-b" required>
                        <option value="">All</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Please select dictionary property for code generation</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Connection Timeout：</label>
                <div class="col-sm-8">
                    <input name="conntimeout" th:field="*{conntimeout}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Socket Timeout：</label>
                <div class="col-sm-8">
                    <input name="sotimeout" th:field="*{sotimeout}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Max Connections：</label>
                <div class="col-sm-8">
                    <input name="connmaxsize" th:field="*{connmaxsize}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Heartbeat Interval：</label>
                <div class="col-sm-8">
                    <input name="heartinteval" th:field="*{heartinteval}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Load Balancing Strategy：</label>
                <div class="col-sm-8">
                    <input name="lbstrategy" th:field="*{lbstrategy}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Enable Balance：</label>
                <div class="col-sm-8">
                    <input name="isbalance" th:field="*{isbalance}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Use Proxy Auth：</label>
                <div class="col-sm-8">
                    <input name="isuseproxyauthor" th:field="*{isuseproxyauthor}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Proxy IP：</label>
                <div class="col-sm-8">
                    <input name="proxyip" th:field="*{proxyip}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Proxy Port：</label>
                <div class="col-sm-8">
                    <input name="proxyport" th:field="*{proxyport}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Proxy Username：</label>
                <div class="col-sm-8">
                    <input name="proxyusername" th:field="*{proxyusername}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Proxy Password：</label>
                <div class="col-sm-8">
                    <input name="proxyuserpass" th:field="*{proxyuserpass}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Remarks：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/group";
        $("#form-group-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-group-edit').serialize());
            }
        }
    </script>
</body>
</html>
