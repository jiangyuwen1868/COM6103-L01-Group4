<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Edit Application')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-appinfo-edit" th:object="${cspAppinfo}">
            <input name="appid" th:field="*{appid}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Application Name：</label>
                <div class="col-sm-8">
                    <input name="appname" th:field="*{appname}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Application Secret：</label>
                <div class="col-sm-8">
                    <input name="appsecret" th:field="*{appsecret}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Tenant ID：</label>
                <div class="col-sm-8">
                    <input name="tenantid" th:field="*{tenantid}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Department：</label>
                <div class="col-sm-8">
                    <input name="deptId" th:field="*{deptId}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">User：</label>
                <div class="col-sm-8">
                    <input name="userId" th:field="*{userId}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Auth Method：</label>
                <div class="col-sm-8">
                    <select name="authtype" class="form-control m-b" required>
                        <option value="">All</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Please select dictionary property for code generation</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Application Status：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" name="appstatus" value="" required>
                        <label th:for="appstatus" th:text="Unknown"></label>
                    </div>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Please select dictionary property for code generation</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">HSM Group：</label>
                <div class="col-sm-8">
                    <input name="hsmgroups" th:field="*{hsmgroups}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Password Service Group：</label>
                <div class="col-sm-8">
                    <input name="srvgroups" th:field="*{srvgroups}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Creator：</label>
                <div class="col-sm-8">
                    <input name="creator" th:field="*{creator}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Creation Time：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="creattime" th:value="${#dates.format(cspAppinfo.creattime, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Description：</label>
                <div class="col-sm-8">
                    <input name="appdesc" th:field="*{appdesc}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Security Rating：</label>
                <div class="col-sm-8">
                    <input name="secretrating" th:field="*{secretrating}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Security Expiry：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="secretdate" th:value="${#dates.format(cspAppinfo.secretdate, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Application Private Key：</label>
                <div class="col-sm-8">
                    <textarea name="appVk" class="form-control">[[*{appVk}]]</textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Application Public Key：</label>
                <div class="col-sm-8">
                    <textarea name="appPk" class="form-control">[[*{appPk}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/appinfo";
        $("#form-appinfo-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-appinfo-edit').serialize());
            }
        }

        $("input[name='creattime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='secretdate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
