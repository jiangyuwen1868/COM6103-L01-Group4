<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Smart Water Device Info List')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-7 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>SN：</label>
                                <input type="text" name="deviceSn"/>
                            </li>
                            <li>
                                <label>Model：</label>
                                <input type="text" name="deviceModel"/>
                            </li>
                            <li>
                                <label>Name：</label>
                                <input type="text" name="userName"/>
                            </li>
                            <li>
                                <label>Phone：</label>
                                <input type="text" name="userPhone"/>
                            </li>
                            <li>
                                <label>ID：</label>
                                <input type="text" name="userIdCard"/>
                            </li>
                            <li>
                                <label>Date：</label>
                                <input type="text" class="time-input" placeholder="Please select activation date" name="activationDate"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:device:add">
                    <i class="fa fa-plus"></i> Add
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:device:edit">
                    <i class="fa fa-edit"></i> Edit
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:device:remove">
                    <i class="fa fa-remove"></i> Delete
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:device:export">
                    <i class="fa fa-download"></i> Export
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:device:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:device:remove')}]];
		var datas = [[${@dict.getType('water_device_type')}]];
		var datas2 = [[${@dict.getType('water_device_status')}]];
        var prefix = ctx + "system/device";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Smart Water Device Info",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'deviceSn',
                    title: 'Device SN'
                },
                {
                    field: 'deviceModel',
                    title: 'Water Meter Model'
                },
                {
                    field: 'deviceType',
                    title: 'Water Meter Type',
				formatter: function(value, item, index) {
		         return $.table.selectDictLabel(datas, item.deviceType);
		        }
                },
                {
                    field: 'manufacturer',
                    title: 'Manufacturer'
                },
                {
                    field: 'productionDate',
                    title: 'Production Date'
                },
                {
                    field: 'installAddress',
                    title: 'Installation Address'
                },
                {
                    field: 'userName',
                    title: 'User Name'
                },
                {
                    field: 'userPhone',
                    title: 'User Phone'
                },
                {
                    field: 'userIdCard',
                    title: 'User ID Card'
                },
                {
                    field: 'installDate',
                    title: 'Installation Date'
                },
                {
                    field: 'activationDate',
                    title: 'Activation Date'
                },
                {
                    field: 'status',
                    title: 'Device Status',
				formatter: function(value, item, index) {
		         return $.table.selectDictLabel(datas2, item.status);
		        }
                },
                {
                    field: 'lastOnlineTime',
                    title: 'Last Online Time'
                },
                {
                    field: 'totalWaterUsage',
                    title: 'Total Water Usage'
                },
                {
                    field: 'remainingAmount',
                    title: 'Remaining Balance'
                },
                {
                    field: 'warningThreshold',
                    title: 'Low Balance Alert Threshold'
                },
                {
                    field: 'firmwareVersion',
                    title: 'Firmware Version'
                },
                {
                    field: 'remark',
                    title: 'Remarks'
                },
                {
                    title: 'Actions',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>Delete</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
