<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Edit Flow Control')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-flowcontrol-edit" th:object="${cspFlowcontrol}">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Application Name：</label>
                <div class="col-sm-8">
                    <input th:field="*{appid}" class="form-control" type="text" required readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">API Service Code：</label>
                <div class="col-sm-8">
                    <input th:field="*{txcode}" class="form-control" type="text" required readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">TPS Count：</label>
                <div class="col-sm-8">
                    <input th:field="*{tpscount}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Operation Switch：</label>
                <div class="col-sm-8">
                    <select th:field="*{opswitch}" class="form-control" required>
                        <option value="0">Off</option>
                        <option value="1">On</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/flowcontrol";
        $("#form-flowcontrol-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-flowcontrol-edit').serialize());
            }
        }
    </script>
</body>
</html>
