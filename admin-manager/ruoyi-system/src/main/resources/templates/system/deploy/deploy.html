<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Deployment Info List')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>Hostname：</label>
                                <input type="text" name="hostname"/>
                            </li>
                            <li>
                                <label>Deploy：</label>
                                <input type="text" name="deploycode"/>
                            </li>
                            <li>
                                <label>App：</label>
                                <input type="text" name="appcode"/>
                            </li>
                            <li>
                                <label>IP：</label>
                                <input type="text" name="sysip"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:deploy:add">
                    <i class="fa fa-plus"></i> Add
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:deploy:edit">
                    <i class="fa fa-edit"></i> Edit
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:deploy:remove">
                    <i class="fa fa-remove"></i> Delete
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:deploy:export">
                    <i class="fa fa-download"></i> Export
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:deploy:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:deploy:remove')}]];
        var prefix = ctx + "system/deploy";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Deployment Info",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'groupid',
                    title: 'Cluster Group ID',
                    visible: true
                },
                {
                    field: 'deployid',
                    title: 'Deployment ID',
                    visible: true
                },
                {
                    field: 'hostname',
                    title: 'Hostname'
                },
                {
                    field: 'username',
                    title: 'Host User'
                },
                {
                    field: 'deploycode',
                    title: 'Deployment Code'
                },
                {
                    field: 'appcode',
                    title: 'Application Code'
                },
                {
                    field: 'sysip',
                    title: 'Deployment IP'
                },
                {
                    field: 'sysport',
                    title: 'Deployment Port'
                },
                {
                    field: 'servaddr',
                    title: 'Service Address'
                },
                {
                    field: 'isuseful',
                    title: 'Enabled',
				visible: false
                },
                {
                    field: 'weight',
                    title: 'Weight',
				visible: false
                },
                {
                    field: 'remark',
                    title: 'Remarks'
                },
                {
                    field: 'centerid',
                    title: 'Center ID',
				visible: false
                },
                {
                    title: 'Actions',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.groupid + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.groupid + '\')"><i class="fa fa-remove"></i>Delete</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
