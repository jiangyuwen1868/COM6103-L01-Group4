<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Edit Deployment')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-deploy-edit" th:object="${cspSysDeploy}">
            <input name="groupid" th:field="*{groupid}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Hostname：</label>
                <div class="col-sm-8">
                    <input name="hostname" th:field="*{hostname}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Host User：</label>
                <div class="col-sm-8">
                    <input name="username" th:field="*{username}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Deploy Code：</label>
                <div class="col-sm-8">
                    <input name="deploycode" th:field="*{deploycode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">App Code：</label>
                <div class="col-sm-8">
                    <input name="appcode" th:field="*{appcode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Deploy IP：</label>
                <div class="col-sm-8">
                    <input name="sysip" th:field="*{sysip}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Deploy Port：</label>
                <div class="col-sm-8">
                    <input name="sysport" th:field="*{sysport}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Service Address：</label>
                <div class="col-sm-8">
                    <input name="servaddr" th:field="*{servaddr}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Enabled：</label>
                <div class="col-sm-8">
                    <input name="isuseful" th:field="*{isuseful}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Weight：</label>
                <div class="col-sm-8">
                    <input name="weight" th:field="*{weight}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Remarks：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Center ID：</label>
                <div class="col-sm-8">
                    <input name="centerid" th:field="*{centerid}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/deploy";
        $("#form-deploy-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-deploy-edit').serialize());
            }
        }
    </script>
</body>
</html>
