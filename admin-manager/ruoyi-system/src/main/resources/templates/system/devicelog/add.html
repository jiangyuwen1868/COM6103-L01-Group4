<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Add Smart Water Data Log')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-log-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Device SN：</label>
                <div class="col-sm-8">
                    <input name="deviceSn" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Data Type：</label>
                <div class="col-sm-8">
                    <select name="dataType" class="form-control m-b" required>
                        <option value="">All</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Please select dictionary property for code generation</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Data Value：</label>
                <div class="col-sm-8">
                    <input name="dataValue" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Data Unit：</label>
                <div class="col-sm-8">
                    <input name="dataUnit" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Data Time：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="dataTime" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Upload Time：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="uploadTime" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Cloud Instruction：</label>
                <div class="col-sm-8">
                    <input type="hidden" class="form-control" name="instructionContent">
                    <div class="summernote" id="instructionContent"></div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Instruction Status：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" name="instructionStatus" value="">
                        <label th:for="instructionStatus" th:text="Unknown"></label>
                    </div>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Please select dictionary property for code generation</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Signal Strength：</label>
                <div class="col-sm-8">
                    <input name="signalStrength" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Battery Level：</label>
                <div class="col-sm-8">
                    <input name="batteryLevel" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Remarks：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: summernote-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/log"
        $("#form-log-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-log-add').serialize());
            }
        }

        $("input[name='dataTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='uploadTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $(function() {
            $('.summernote').summernote({
                lang: 'en-US',
                callbacks: {
                    onChange: function(contents, $edittable) {
                        $("input[name='" + this.id + "']").val(contents);
                    },
                    onImageUpload: function(files) {
                        var obj = this;
                    	var data = new FormData();
                    	data.append("file", files[0]);
                    	$.ajax({
                            type: "post",
                            url: ctx + "common/upload",
                    		data: data,
                    		cache: false,
                    		contentType: false,
                    		processData: false,
                    		dataType: 'json',
                    		success: function(result) {
                    		    if (result.code == web_status.SUCCESS) {
                    		        $('#' + obj.id).summernote('insertImage', result.url);
                    		    } else {
                    		        $.modal.alertError(result.msg);
                    		    }
                    		},
                    		error: function(error) {
                    		    $.modal.alertWarning("Image upload failed.");
                    		}
                    	});
                    }
                }
            });
        });
    </script>
</body>
</html>
