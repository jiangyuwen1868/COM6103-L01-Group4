<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Smart Water Data Log List')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>SN：</label>
                                <input type="text" name="deviceSn"/>
                            </li>
                            <li>
                                <label>Type：</label>
                                <select name="dataType">
                                    <option value="">All</option>
                                    <option value="-1">Please select dictionary attribute for code generation</option>
                                </select>
                            </li>
                            <li>
                                <label>Time：</label>
                                <input type="text" class="time-input" placeholder="Please select data time" name="dataTime"/>
                            </li>
                            <li>
                                <label>Status：</label>
                                <select name="instructionStatus">
                                    <option value="">All</option>
                                    <option value="-1">Please select dictionary attribute for code generation</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:log:add">
                    <i class="fa fa-plus"></i> Add
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:log:edit">
                    <i class="fa fa-edit"></i> Edit
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:log:remove">
                    <i class="fa fa-remove"></i> Delete
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:log:export">
                    <i class="fa fa-download"></i> Export
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:devicelog:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:devicelog:remove')}]];
		var datas = [[${@dict.getType('meter_data_type')}]];
        var prefix = ctx + "system/devicelog";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Smart Water Data Log",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'deviceSn',
                    title: 'Device SN'
                },
                {
                    field: 'dataType',
                    title: 'Data Type',
				formatter: function(value, item, index) {
		         return $.table.selectDictLabel(datas, item.dataType);
		        }
                },
                {
                    field: 'dataValue',
                    title: 'Data Value'
                },
                {
                    field: 'dataUnit',
                    title: 'Data Unit'
                },
                {
                    field: 'dataTime',
                    title: 'Data Time'
                },
                {
                    field: 'uploadTime',
                    title: 'Upload Time'
                },
                {
                    field: 'instructionContent',
                    title: 'Instruction Content'
                },
                {
                    field: 'instructionStatus',
                    title: 'Instruction Status'
                },
                {
                    field: 'signalStrength',
                    title: 'Signal Strength'
                },
                {
                    field: 'batteryLevel',
                    title: 'Battery Level'
                },
                {
                    field: 'remark',
                    title: 'Remarks'
                },
                {
                    title: 'Actions',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>Delete</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
